      - name: (진단용, Slack 미전송) 5일/10일 지평 적중률 확인 — 보유기간 재정의 검토
        # 2026-09-17: "적중률 높일 방안" 검토 후속 — 위 1일 vs 3일 비교(2026-09-11)에서 매수 신호가
        # 1일 29%→3일 44%로 뚜렷이 개선된 것을 계기로, 이 시스템이 "1~3일 단기 반전 예측기"가
        # 아니라 "며칠~1~2주짜리 추세 포착기"에 더 가까울 가능성을 검토 — ATR×2.5 목표가 자체가
        # 통상 하루 안에 안 닿는 폭으로 설계돼 있는 점과도 일치하는 가설. stock_signal_log엔
        # 1일/3일 스냅샷만 있어(5일/10일 컬럼 없음, 스키마 변경 없이) FinanceDataReader로
        # 종목당 1회 조회해 5거래일/10거래일 후 종가를 직접 계산 — 위 "거래대금 구간별 적중률"
        # 진단과 동일한 날짜 매칭 패턴 재사용. 새 Supabase 컬럼·마이그레이션 불필요
        # 2026-09-17 같은 날 후속: 최초 실행(원시 수익률)에서 매수 40%→44%→72%(평균 +7.8%)로
        # 개선되는 동시에 매도가 54%→51%→46%로 반대 방향 악화되는 패턴이 나옴 — backtest_trading_rules.py가
        # 이미 겪은 "원시수익률 역전이 초과수익률+유의성검정 적용 시 사라짐(p=0.324, 2026-09-14)"과
        # 같은 유형의 시장 전체 드리프트 교란 가능성을 배제 못 해, 같은 방식(코스피 수익률 차감)의
        # 초과수익률 버전을 같이 계산해 병기 — KS11을 전체 대상 신호의 날짜범위로 한 번만 조회해
        # 공유(종목별 재조회 안 함, `_scan_once()`의 `self._index_ohlcv` 공유 방식과 동일 원칙),
        # 종목과 동일한 "정렬된 거래일 리스트에서의 위치 오프셋" 방식으로 코스피 진입일 인덱스를
        # 찾아 h거래일 후 코스피 수익률을 계산 → excess = raw - kospi. hit 판정 함수(is_hit)는
        # 그대로 재사용(부호 규칙 동일, 값만 excess로 교체)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from src.monitor.supabase_store import SupabaseSignalStore
          from src.analysis.signal_generator import SignalType
          import FinanceDataReader as fdr

          KST = ZoneInfo("Asia/Seoul")
          BUY_TYPES = {SignalType.BUY.value, SignalType.STRONG_BUY.value}
          SELL_TYPES = {SignalType.SELL.value, SignalType.STRONG_SELL.value}
          WATCH_TYPE = SignalType.WATCH.value

          def is_hit(signal_type, ret):
              return ret < 0 if signal_type in SELL_TYPES else ret > 0

          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          # 10거래일(주말/공휴일 감안 ~16 달력일) 이상 지난 신호만 대상 — since는 넉넉히 180일
          since_iso = (datetime.now(KST) - timedelta(days=180)).astimezone(timezone.utc).isoformat()
          cutoff = datetime.now(KST) - timedelta(days=16)
          rows = store.get_evaluated_signals(since_iso)
          old_rows = []
          for r in rows:
              alerted_kst = datetime.fromisoformat(r["alerted_at"].replace("Z", "+00:00")).astimezone(KST)
              if alerted_kst < cutoff and r.get("current_price"):
                  r["_alerted_kst"] = alerted_kst
                  old_rows.append(r)
          print(f"[진단] 5일/10일 지평 계산 대상(10거래일 이상 경과) {len(old_rows)}건 — 전체 평가완료 {len(rows)}건 중")

          # ── 코스피(KS11) 한 번만 조회해 전 종목이 공유 (초과수익률 계산용, 2026-09-17 추가) ──
          kospi_close_dates = []
          kospi_closes = []
          if old_rows:
              all_dates = [r["_alerted_kst"].date() for r in old_rows]
              k_start, k_end = min(all_dates), max(all_dates)
              try:
                  kdf = fdr.DataReader("KS11", start=k_start - timedelta(days=5), end=k_end + timedelta(days=20))
                  kdf.index = kdf.index.date
                  kospi_close_dates = sorted(kdf.index)
                  kospi_closes = [float(kdf.loc[d, "Close"]) for d in kospi_close_dates]
              except Exception as e:
                  print(f"[진단] KS11 조회 실패 — 초과수익률 계산 생략: {e}")

          def kospi_fwd_pct(entry_date, h):
              if entry_date not in kospi_close_dates:
                  return None
              idx = kospi_close_dates.index(entry_date)
              if idx + h >= len(kospi_close_dates):
                  return None
              return (kospi_closes[idx + h] - kospi_closes[idx]) / kospi_closes[idx] * 100

          by_ticker = defaultdict(list)
          for r in old_rows:
              by_ticker[r["ticker"]].append(r)

          errors = 0
          for ticker, trows in by_ticker.items():
              dates = [r["_alerted_kst"].date() for r in trows]
              start, end = min(dates), max(dates)
              try:
                  df = fdr.DataReader(ticker, start=start - timedelta(days=5), end=end + timedelta(days=20))
              except Exception as e:
                  errors += len(trows)
                  print(f"  [{ticker}] 조회 실패: {e}")
                  continue
              if df.empty:
                  errors += len(trows)
                  continue
              df.index = df.index.date
              close_dates = sorted(df.index)
              for r, d in zip(trows, dates):
                  if d not in close_dates:
                      errors += 1
                      continue
                  idx = close_dates.index(d)
                  entry = r["current_price"]
                  for h, key in [(5, "fwd_5d_pct"), (10, "fwd_10d_pct")]:
                      if idx + h < len(close_dates):
                          future_close = float(df.loc[close_dates[idx + h], "Close"])
                          r[key] = (future_close - entry) / entry * 100
                          kfwd = kospi_fwd_pct(d, h)
                          if kfwd is not None:
                              r[f"excess_{h}d_pct"] = r[key] - kfwd

          print(f"[진단] FDR 조회 실패/날짜매칭 실패로 제외 {errors}건")
          print(f"[진단] 코스피(KS11) 매칭 거래일 {len(kospi_close_dates)}개 — 초과수익률 계산 기준")

          for label, types in [("매수", BUY_TYPES), ("매도", SELL_TYPES), ("관심", {WATCH_TYPE})]:
              group_all = [r for r in old_rows if r["signal_type"] in types]

              def bucket(key, horizon_label):
                  g = [r for r in group_all if r.get(key) is not None]
                  if len(g) < 5:
                      return f"{horizon_label} {len(g)}건(5건 미만, 참고용)"
                  hits = sum(1 for r in g if is_hit(r["signal_type"], r[key]))
                  avg = sum(r[key] for r in g) / len(g)
                  return f"{horizon_label} {len(g)}건 적중 {hits}/{len(g)}({hits/len(g)*100:.0f}%, 평균 {avg:+.1f}%)"

              if len(group_all) < 5:
                  print(f"  {label}: {len(group_all)}건 (5건 미만, 참고용)")
                  continue
              hits_1d = sum(1 for r in group_all if is_hit(r["signal_type"], r["return_1d_pct"]))
              avg_1d = sum(r["return_1d_pct"] for r in group_all) / len(group_all)
              print(f"  {label} — 1일: {len(group_all)}건 적중 {hits_1d}/{len(group_all)}({hits_1d/len(group_all)*100:.0f}%, 평균 {avg_1d:+.1f}%)")
              print(f"    [원시] {bucket('fwd_5d_pct', '5일')}")
              print(f"    [원시] {bucket('fwd_10d_pct', '10일')}")
              print(f"    [초과수익률(vs코스피)] {bucket('excess_5d_pct', '5일')}")
              print(f"    [초과수익률(vs코스피)] {bucket('excess_10d_pct', '10일')}")
          PY

      - name: (진단용, Slack 미전송) 투자자 수급 아카이브 — 외국인/기관 순매수와 익일 수익률
        # 2026-09-11: 투자자 수급(30% 가중치)은 KIS API가 최근 30거래일만 제공해 지금까지
        # 단 한 번도 백테스트된 적이 없는 유일한 신호 성분(technical_score만 backtest_technical_score.py로
        # 검증됨, 위 CLAUDE.md "기술적 지표 가중치" 참고) — archive_investor_data.py가
        # 2026-08-25부터 매일 쌓아온 stock_investor_daily_archive를 이제 처음으로 활용해
        # "외국인/기관 순매수였던 날 vs 순매도였던 날, 익일 수익률이 실제로 다른가"를 직접 검증.
        # 종목별 FDR 조회 1회로 아카이브된 모든 날짜를 매칭(신규 API 호출 최소화).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from collections import defaultdict
          from datetime import date, timedelta
          from supabase import create_client
          import FinanceDataReader as fdr

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          result = (
              client.table("stock_investor_daily_archive")
              .select("ticker,archive_date,foreign_qty,institution_qty")
              .order("ticker")
              .order("archive_date")
              .execute()
          )
          rows = result.data or []
          print(f"[진단] 투자자 수급 아카이브 {len(rows)}건(2026-08-25부터 수집) — 외국인/기관 순매수·순매도별 익일 수익률")

          by_ticker = defaultdict(list)
          for r in rows:
              by_ticker[r["ticker"]].append(r)

          foreign_buckets = defaultdict(list)
          institution_buckets = defaultdict(list)
          matched = 0
          errors = 0

          for ticker, trows in by_ticker.items():
              trows.sort(key=lambda r: r["archive_date"])
              dates = [date(int(r["archive_date"][:4]), int(r["archive_date"][4:6]), int(r["archive_date"][6:])) for r in trows]
              start, end = min(dates), max(dates)
              try:
                  df = fdr.DataReader(ticker, start=start - timedelta(days=5), end=end + timedelta(days=10))
              except Exception:
                  errors += len(trows)
                  continue
              if df.empty:
                  errors += len(trows)
                  continue
              df.index = df.index.date
              close_dates = sorted(df.index)
              for r, d in zip(trows, dates):
                  if d not in close_dates:
                      errors += 1
                      continue
                  idx = close_dates.index(d)
                  if idx + 1 >= len(close_dates):
                      errors += 1  # 다음 거래일 데이터 아직 없음(최근 아카이브 날짜)
                      continue
                  next_d = close_dates[idx + 1]
                  try:
                      close_today = float(df.loc[d, "Close"])
                      close_next = float(df.loc[next_d, "Close"])
                  except Exception:
                      errors += 1
                      continue
                  next_return = (close_next - close_today) / close_today * 100
                  matched += 1

                  foreign = r.get("foreign_qty") or 0
                  institution = r.get("institution_qty") or 0
                  foreign_buckets["순매수" if foreign > 0 else ("순매도" if foreign < 0 else "보합")].append(next_return)
                  institution_buckets["순매수" if institution > 0 else ("순매도" if institution < 0 else "보합")].append(next_return)

          print(f"[진단] 매칭 성공 {matched}건, 조회실패/다음거래일없음 등 제외 {errors}건")

          def report(name, buckets):
              print(f"*{name}*")
              for label in ["순매수", "순매도", "보합"]:
                  group = buckets.get(label, [])
                  if len(group) < 5:
                      print(f"  {label}: {len(group)}건 (5건 미만, 참고용)")
                      continue
                  hits = sum(1 for x in group if x > 0)
                  avg = sum(group) / len(group)
                  print(f"  {label}: {len(group)}건, 익일상승 {hits}/{len(group)}({hits/len(group)*100:.0f}%), 평균 {avg:+.2f}%")

          report("외국인 순매수/순매도별 익일 수익률", foreign_buckets)
          report("기관 순매수/순매도별 익일 수익률", institution_buckets)
          PY

      - name: (진단용, Slack 미전송) 투자자 수급 가중공식 정식 재현 — InvestorAnalyzer 실제 공식으로 백테스트
        # 2026-09-14: 위(2026-09-11) 진단은 "당일 순매수 부호"만 본 단순화 버전이었음 — 이번엔
        # investor_analyzer.py의 실제 가중공식(외국인45%+기관35%+개인20%역방향, 당일50%+추세50%,
        # 연속일수 보너스)을 InvestorAnalyzer를 직접 import해 그대로 재현. 종목별 아카이브를
        # 시간순 정렬해 각 시점마다 그 이전 최대 5일치를 history로 넘겨 get_investor_score()를
        # 그대로 호출 — 근사가 아니라 실제 운영과 동일한 계산 경로.
        # ⚠️ 표본 한계: 아카이브가 2026-08-25부터 수집 시작(3주치 남짓)이라 history가 5일
        # 미만인 이른 시점 데이터가 섞여 있음 — history 깊이별로도 나눠서 확인(짧은 history일수록
        # analyze_history()의 연속일수·추세 성분이 왜곡될 수 있음)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from collections import defaultdict
          from datetime import date, timedelta
          from supabase import create_client
          import FinanceDataReader as fdr
          import pandas as pd
          from src.analysis.investor_analyzer import InvestorAnalyzer

          analyzer = InvestorAnalyzer()
          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          result = (
              client.table("stock_investor_daily_archive")
              .select("ticker,archive_date,foreign_qty,institution_qty,individual_qty,program_qty")
              .order("ticker")
              .order("archive_date")
              .execute()
          )
          rows = result.data or []
          print(f"[진단] 투자자 수급 아카이브 {len(rows)}건 — 실제 가중공식(InvestorAnalyzer) 재현 백테스트")

          by_ticker = defaultdict(list)
          for r in rows:
              by_ticker[r["ticker"]].append(r)

          def to_dict(row):
              return {
                  "foreign": row.get("foreign_qty") or 0,
                  "institution": row.get("institution_qty") or 0,
                  "individual": row.get("individual_qty") or 0,
                  "program": row.get("program_qty") or 0,
              }

          scored = []  # (score, next_return, history_len)
          errors = 0

          for ticker, trows in by_ticker.items():
              trows.sort(key=lambda r: r["archive_date"])
              if len(trows) < 2:
                  continue
              dates = [date(int(r["archive_date"][:4]), int(r["archive_date"][4:6]), int(r["archive_date"][6:])) for r in trows]
              start, end = min(dates), max(dates)
              try:
                  df = fdr.DataReader(ticker, start=start - timedelta(days=5), end=end + timedelta(days=10))
              except Exception:
                  errors += len(trows)
                  continue
              if df.empty:
                  errors += len(trows)
                  continue
              df.index = df.index.date
              close_dates = sorted(df.index)

              for i, r in enumerate(trows):
                  d = dates[i]
                  if d not in close_dates:
                      errors += 1
                      continue
                  idx = close_dates.index(d)
                  if idx + 1 >= len(close_dates):
                      errors += 1  # 다음 거래일 데이터 아직 없음(최근 아카이브 날짜)
                      continue
                  next_d = close_dates[idx + 1]
                  try:
                      close_today = float(df.loc[d, "Close"])
                      close_next = float(df.loc[next_d, "Close"])
                  except Exception:
                      errors += 1
                      continue
                  next_return = (close_next - close_today) / close_today * 100

                  history = [to_dict(h) for h in trows[max(0, i - 5):i]]
                  current = to_dict(r)
                  try:
                      score_result = analyzer.get_investor_score(current, history)
                  except Exception as e:
                      errors += 1
                      continue
                  scored.append((score_result["score"], next_return, len(history)))

          print(f"[진단] 점수 산출 성공 {len(scored)}건, 조회실패/제외 {errors}건")

          if len(scored) >= 20:
              sdf = pd.DataFrame(scored, columns=["score", "next_return", "hist_len"])
              corr = sdf["score"].corr(sdf["next_return"])
              top = sdf[sdf["score"] >= sdf["score"].quantile(0.8)]
              bot = sdf[sdf["score"] <= sdf["score"].quantile(0.2)]
              spread = top["next_return"].mean() - bot["next_return"].mean()
              print(f"[전체] corr(투자자심리점수, 익일수익률)={corr:+.4f}, 상하위20% 스프레드={spread:+.3f}%p (n={len(sdf)})")

              pos = sdf[sdf["score"] > 0]
              neg = sdf[sdf["score"] < 0]
              for label, g in [("score>0(순매수 우위)", pos), ("score<0(순매도 우위)", neg)]:
                  if len(g) < 5:
                      print(f"  {label}: {len(g)}건 (5건 미만, 참고용)")
                      continue
                  hits = (g["next_return"] > 0).sum()
                  avg = g["next_return"].mean()
                  print(f"  {label}: {len(g)}건, 익일상승 {hits}/{len(g)}({hits/len(g)*100:.0f}%), 평균 {avg:+.2f}%")

              print("[history 깊이별 재확인 — 표본 대부분이 짧은 history인지 확인]")
              for lo, hi, label in [(0, 1, "history 0~1일(아카이브 초반, 신뢰도 낮음)"), (2, 4, "history 2~4일"), (5, 5, "history 5일(정상 깊이)")]:
                  g = sdf[(sdf["hist_len"] >= lo) & (sdf["hist_len"] <= hi)]
                  if len(g) < 5:
                      print(f"  {label}: {len(g)}건 (5건 미만, 참고용)")
                      continue
                  c = g["score"].corr(g["next_return"])
                  directional = g[g["score"] != 0]
                  dir_hits = (((directional["score"] > 0) & (directional["next_return"] > 0)) | ((directional["score"] < 0) & (directional["next_return"] < 0))).sum()
                  hit_rate = dir_hits / len(directional) * 100 if len(directional) else float("nan")
                  print(f"  {label}: {len(g)}건, corr={c:+.4f}, 방향적중 {dir_hits}/{len(directional)}({hit_rate:.0f}%)")
          else:
              print("[결론] 표본 부족(20건 미만) — 판단 보류")
          PY

      - name: (진단용, Slack 미전송) PER/PBR/호가잔량/체결강도 필드 실측 확인 — 최근 신호 저장값 조회
        # 2026-09-11: PER/PBR 필드가 KIS 응답(FHKST01010100)에 실제로 있는지, save_signal()이
        # 마이그레이션 후 정상 저장하는지를 콘솔에서 직접 확인 — Slack 메시지 본문은 GitHub
        # Actions 로그에 안 찍히고, 이 세션에 연결된 Slack이 실제 봇이 알림을 보내는 채널과
        # 다른 워크스페이스로 보여 Slack에서 직접 확인이 어려웠음. 최근 저장된 신호 중
        # per/pbr이 실제로 값이 들어있는지(그리고 코스피 평균 근처의 그럴듯한 범위인지)
        # DB에서 바로 확인. bid_ask_ratio/execution_strength도 마이그레이션 완료 후 동일하게
        # 확인 — 단, 이 두 필드는 쿨다운 통과 종목에만 조회되므로(위 구현 범위 참고) per/pbr보다
        # 채워질 확률이 낮음(알림 자체가 드물면 최근 20건에도 없을 수 있음, 정상)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from supabase import create_client

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          result = (
              client.table("stock_signal_log")
              .select("ticker,signal_type,alerted_at,per,pbr,bid_ask_ratio,execution_strength")
              .order("alerted_at", desc=True)
              .limit(20)
              .execute()
          )
          rows = result.data or []
          print(f"[진단] 최근 신호 {len(rows)}건 — per/pbr/bid_ask_ratio/execution_strength 저장값 확인")
          have_value = 0
          have_bar = 0
          have_es = 0
          for r in rows:
              per, pbr, bar, es = r.get("per"), r.get("pbr"), r.get("bid_ask_ratio"), r.get("execution_strength")
              if per is not None or pbr is not None:
                  have_value += 1
              if bar is not None:
                  have_bar += 1
              if es is not None:
                  have_es += 1
              print(f"  [{r['ticker']}] {r['signal_type']} @ {r['alerted_at']}: per={per}, pbr={pbr}, bid_ask_ratio={bar}, execution_strength={es}")
          print(f"[결론] {len(rows)}건 중 per/pbr 값이 있는 건 {have_value}건, bid_ask_ratio 값이 있는 건 {have_bar}건, execution_strength 값이 있는 건 {have_es}건")
          if have_value == 0:
              print("  [경고] per/pbr 전부 비어있음 — 필드명이 실제 KIS 응답과 다르거나 마이그레이션 미반영 의심")
          if have_bar == 0:
              print("  [참고] bid_ask_ratio 전부 비어있음 — 알림이 드물면 정상일 수 있음(쿨다운 통과 종목만 조회), 경고 아님")
          if have_es == 0:
              print("  [참고] execution_strength 전부 비어있음 — 알림이 드물면 정상일 수 있음(쿨다운 통과 종목만 조회), 경고 아님")
          PY

      - name: (진단용, Slack 미전송) 호가잔량·체결강도 vs 적중률 — 1주일치 첫 확인
        # 2026-09-17: "적중률 높일 방안" 검토 요청으로 재우선순위화 — 호가잔량(bid_ask_ratio)·
        # 체결강도(execution_strength, 둘 다 2026-09-11 추가)는 EOD 수급(외국인/기관 순매수,
        # 위 investor archive 진단에서 corr≈0으로 확인)과 달리 그 순간의 실시간 매수/매도
        # 압력이라 성격이 다른 유일한 미검증 축 — 표본이 아직 1주일치뿐이라 결론은 못 내리지만
        # "지금 몇 건이 쌓였고 방향이라도 있는지" 최초 확인. return_1d_pct가 채워진(1일 평가
        # 완료) 신호 중 두 필드가 있는 것만 대상, 자연스러운 중립점(비율=1.0, 체결강도=100)
        # 기준으로 매수우위/매도우위 2분할 — terciles은 표본이 이만큼 작을 땐 과도한 세분화라
        # 판단해 다른 진단(거래대금 등)과 달리 2분할만 사용
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from src.monitor.supabase_store import SupabaseSignalStore
          from src.analysis.signal_generator import SignalType

          KST = ZoneInfo("Asia/Seoul")
          BUY_TYPES = {SignalType.BUY.value, SignalType.STRONG_BUY.value}
          SELL_TYPES = {SignalType.SELL.value, SignalType.STRONG_SELL.value}

          def is_hit(signal_type, ret):
              return ret < 0 if signal_type in SELL_TYPES else ret > 0

          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          # bid_ask_ratio/execution_strength는 2026-09-11 도입이라 그 이후만 봐도 충분 —
          # since=180일(다른 진단과 동일 창)로 조회해도 그 이전 신호는 두 필드가 애초에 None
          since_iso = (datetime.now(KST) - timedelta(days=180)).astimezone(timezone.utc).isoformat()
          rows = store.get_evaluated_signals(since_iso)

          def bucket_print(label, group):
              if len(group) < 5:
                  print(f"  {label}: {len(group)}건 (5건 미만, 참고용)")
                  return
              hits = sum(1 for r in group if is_hit(r["signal_type"], r["return_1d_pct"]))
              avg = sum(r["return_1d_pct"] for r in group) / len(group)
              print(f"  {label}: {len(group)}건, 적중 {hits}/{len(group)}({hits/len(group)*100:.0f}%), 평균 {avg:+.1f}%")

          bar_rows = [r for r in rows if r.get("bid_ask_ratio") is not None]
          print(f"[진단] bid_ask_ratio 있는 평가완료 신호 {len(bar_rows)}건 (전체 평가완료 {len(rows)}건 중)")
          bucket_print("매수잔량 우위(bid_ask_ratio>1)", [r for r in bar_rows if r["bid_ask_ratio"] > 1])
          bucket_print("매도잔량 우위(bid_ask_ratio<=1)", [r for r in bar_rows if r["bid_ask_ratio"] <= 1])
          buy_bar = [r for r in bar_rows if r["signal_type"] in BUY_TYPES]
          bucket_print("  (매수 신호만) 매수잔량 우위", [r for r in buy_bar if r["bid_ask_ratio"] > 1])
          bucket_print("  (매수 신호만) 매도잔량 우위", [r for r in buy_bar if r["bid_ask_ratio"] <= 1])

          es_rows = [r for r in rows if r.get("execution_strength") is not None]
          print(f"[진단] execution_strength 있는 평가완료 신호 {len(es_rows)}건 (전체 평가완료 {len(rows)}건 중)")
          bucket_print("체결강도 매수우위(>100)", [r for r in es_rows if r["execution_strength"] > 100])
          bucket_print("체결강도 매도우위(<=100)", [r for r in es_rows if r["execution_strength"] <= 100])
          buy_es = [r for r in es_rows if r["signal_type"] in BUY_TYPES]
          bucket_print("  (매수 신호만) 체결강도 매수우위", [r for r in buy_es if r["execution_strength"] > 100])
          bucket_print("  (매수 신호만) 체결강도 매도우위", [r for r in buy_es if r["execution_strength"] <= 100])

          if len(bar_rows) < 15 and len(es_rows) < 15:
              print("[결론] 표본이 너무 작아(15건 미만) 판단 보류 — 2주 정도 더 쌓인 뒤 재확인 권장")

      - name: (진단용, Slack 미전송) 가상매매 누적 흑자 전환이 시장 드리프트인지 확인 — 코스피 대비 초과수익률
        # 2026-09-23: 사용자가 "가상매매 3주 연속 개선이 장이 좋아서인지 로직이 타이밍을 잡은
        # 것인지" 질의 — 지금까지 가상매매 수익률은 전부 원시(raw) 수익률만 봤고, backtest_trading_rules.py가
        # 2026-09-14에 이미 겪은 "원시수익률 개선이 실은 시장 전체 드리프트였다(p=0.324로 무의미)"는
        # 것과 동일한 함정을 아직 점검 안 함. stock_virtual_position은 entry_at/exit_at이 정확한
        # 타임스탬프로 있어(신호처럼 "h거래일 후"를 추정할 필요 없음) 각 거래의 보유기간 그대로
        # 코스피(KS11) 수익률을 계산해 raw - kospi = excess로 직접 비교. KS11은 전체 대상 거래의
        # 날짜범위로 한 번만 조회해 공유(종목별 재조회 없음, 다른 진단과 동일 원칙)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from collections import defaultdict
          from datetime import datetime, timedelta, date
          from zoneinfo import ZoneInfo
          from src.monitor.supabase_store import SupabaseSignalStore
          import FinanceDataReader as fdr

          KST = ZoneInfo("Asia/Seoul")

          def week_start(d: date) -> date:
              return d - timedelta(days=d.weekday())

          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          since_iso = "2026-08-01T00:00:00+00:00"
          rows = store.get_closed_virtual_positions(since_iso)
          print(f"[진단] 청산 완료 가상매매 {len(rows)}건(2026-08-01 이후) — 코스피 대비 초과수익률 계산")

          parsed = []
          for r in rows:
              try:
                  entry_kst = datetime.fromisoformat(r["entry_at"].replace("Z", "+00:00")).astimezone(KST).date()
                  exit_kst = datetime.fromisoformat(r["exit_at"].replace("Z", "+00:00")).astimezone(KST).date()
              except Exception:
                  continue
              if r.get("return_pct") is None:
                  continue
              r["_entry_date"] = entry_kst
              r["_exit_date"] = exit_kst
              parsed.append(r)

          if not parsed:
              print("[진단] 파싱 가능한 청산 거래 없음 — 종료")
          else:
              d_min = min(r["_entry_date"] for r in parsed)
              d_max = max(r["_exit_date"] for r in parsed)
              kdf = fdr.DataReader("KS11", start=d_min - timedelta(days=10), end=d_max + timedelta(days=3))
              kdf.index = kdf.index.date
              kospi_dates = sorted(kdf.index)
              kospi_close = {d: float(kdf.loc[d, "Close"]) for d in kospi_dates}

              def nearest_close_on_or_before(d):
                  cand = [kd for kd in kospi_dates if kd <= d]
                  return kospi_close[cand[-1]] if cand else None

              kospi_total_return = None
              if kospi_dates:
                  kospi_total_return = (kospi_close[kospi_dates[-1]] - kospi_close[kospi_dates[0]]) / kospi_close[kospi_dates[0]] * 100
                  print(f"[진단] 코스피(KS11) {kospi_dates[0]}~{kospi_dates[-1]} 기간 수익률: {kospi_total_return:+.2f}% (전체 시장 방향 참고용)")

              missing = 0
              for r in parsed:
                  p0 = nearest_close_on_or_before(r["_entry_date"])
                  p1 = nearest_close_on_or_before(r["_exit_date"])
                  if p0 is None or p1 is None or p0 == 0:
                      missing += 1
                      continue
                  kospi_ret = (p1 - p0) / p0 * 100
                  r["_kospi_return_pct"] = kospi_ret
                  r["_excess_return_pct"] = r["return_pct"] - kospi_ret
              print(f"[진단] 코스피 매칭 실패(거래일 없음) {missing}건 제외")

              matched = [r for r in parsed if r.get("_excess_return_pct") is not None]

              by_week = defaultdict(list)
              for r in matched:
                  by_week[week_start(r["_exit_date"])].append(r)

              print("\n[결과] 주차별 원시 vs 초과수익률(vs코스피, exit_at 기준 주 단위)")
              for wk in sorted(by_week):
                  wrows = by_week[wk]
                  n = len(wrows)
                  avg_raw = sum(r["return_pct"] for r in wrows) / n
                  avg_kospi = sum(r["_kospi_return_pct"] for r in wrows) / n
                  avg_excess = sum(r["_excess_return_pct"] for r in wrows) / n
                  print(
                      f"  {wk.strftime('%m/%d')}주 ({n}건) — 원시 평균 {avg_raw:+.2f}% | "
                      f"코스피 평균(보유기간 매칭) {avg_kospi:+.2f}% | 초과수익률 평균 {avg_excess:+.2f}%"
                  )

              if matched:
                  n = len(matched)
                  avg_raw = sum(r["return_pct"] for r in matched) / n
                  avg_kospi = sum(r["_kospi_return_pct"] for r in matched) / n
                  avg_excess = sum(r["_excess_return_pct"] for r in matched) / n
                  print(f"\n[결과] 누적({n}건) — 원시 평균 {avg_raw:+.2f}% | 코스피 평균 {avg_kospi:+.2f}% | 초과수익률 평균 {avg_excess:+.2f}%")

                  try:
                      from scipy import stats
                      excess_vals = [r["_excess_return_pct"] for r in matched]
                      if len(excess_vals) >= 2:
                          t, p = stats.ttest_1samp(excess_vals, 0)
                          print(f"[검정] 누적 초과수익률 평균이 0과 다른가: p={p:.3f}")
                      recent = [r for r in matched if r["_exit_date"] >= date(2026, 9, 7)]
                      if len(recent) >= 2:
                          rt, rp = stats.ttest_1samp([r["_excess_return_pct"] for r in recent], 0)
                          avg_recent_excess = sum(r["_excess_return_pct"] for r in recent) / len(recent)
                          avg_recent_raw = sum(r["return_pct"] for r in recent) / len(recent)
                          print(
                              f"[검정] 09/07주 이후({len(recent)}건, '3주 연속 개선' 구간) 초과수익률 평균 "
                              f"{avg_recent_excess:+.2f}%(원시 {avg_recent_raw:+.2f}%)가 0과 다른가: p={rp:.3f}"
                          )
                  except Exception as e:
                      print(f"[검정] 실패: {e}")
          PY
