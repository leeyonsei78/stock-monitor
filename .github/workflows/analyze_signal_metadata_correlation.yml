          SELL_TYPES = {SignalType.SELL.value, SignalType.STRONG_SELL.value}
          WATCH_TYPE = SignalType.WATCH.value

          def is_hit(signal_type, ret):
              return ret < 0 if signal_type in SELL_TYPES else ret > 0

          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
