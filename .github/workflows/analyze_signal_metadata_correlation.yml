name: 신규 지표 상관관계 분석

on:
  workflow_dispatch:  # 수동 실행 버튼 — analyze_signal_metadata_correlation.py와 동일하게
                      # 스케줄 없음(backtest_trading_rules.py와 동일 원칙, 데이터 쌓이는 대로 수동 실행)

jobs:
  correlation-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 신규 지표 상관관계 분석
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .venv/bin/python analyze_signal_metadata_correlation.py

      - name: (진단용, Slack 미전송) standalone_score_max 강화 이후 매도 사유별 적중률
        # 2026-08-28 누적 전체 기준 "외국인연속매도단독" 34%(31/90)는 8/28 이전(느슨한
        # score<0 가드) 데이터가 대부분 섞인 수치라 현재(-0.15) 가드의 실제 성능 판단
        # 근거로 쓰기엔 부정확함 — 콘솔 출력만(Slack 미전송) 하는 1회성 진단으로 가드
        # 적용 시점(2026-08-28) 이후 데이터만 걸러서 실제 개선 여부를 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from src.monitor.supabase_store import SupabaseSignalStore
          from weekly_accuracy_report import SELL_TYPES, _SELL_REASON_CATEGORIES

          KST = ZoneInfo("Asia/Seoul")
          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          since_iso = datetime(2026, 8, 28, 0, 0, 0, tzinfo=KST).astimezone(timezone.utc).isoformat()
          rows = store.get_evaluated_signals(since_iso)
          sell_rows = [r for r in rows if r["signal_type"] in SELL_TYPES and r.get("reason")]
          print(f"[진단] standalone_score_max(-0.15) 적용(2026-08-28) 이후 평가완료 신호 {len(rows)}건, 매도 {len(sell_rows)}건")
          for label, keyword in _SELL_REASON_CATEGORIES:
              group = [r for r in sell_rows if keyword in r["reason"]]
              if not group:
                  print(f"  {label}: 0건")
                  continue
              hits = sum(1 for r in group if r["return_1d_pct"] < 0)
              avg = sum(r["return_1d_pct"] for r in group) / len(group)
              avg_score = sum(r["score"] for r in group) / len(group)
              note = " [표본 5건 미만 — 참고용]" if len(group) < 5 else ""
              print(f"  {label}: {hits}/{len(group)}적중(평균 {avg:+.1f}%, 평균종합점수 {avg_score:+.3f}){note}")
          PY

      - name: (진단용, Slack 미전송) RSI·거래량 게이트 완화 시뮬레이션
        # 매수 신호가 종합점수 매수선(0.30)은 넘었는데 RSI(≤60)·거래량(≥1.3배) AND조건에 막혀
        # 관심(WATCH)으로 밀리는 비율이 85.5%(147/172)로 확인됨(2026-09-02) — 이 게이트를
        # 완화하면 매수 표본이 늘어날지, 늘어난다면 그 표본이 실제로 쓸만한지(적중률) 확인하는
        # 1회성 진단. watch_blocked_by(어느 게이트에 막혔는지, 2026-08-25 추가 컬럼)를 그대로
        # 활용 — 새 API 호출도 코드 변경도 없이 이미 쌓인 데이터만으로 "그 게이트가 없었다면
        # 어떻게 됐을지"를 실측할 수 있음. 실제 RSI/거래량 원시값은 저장 안 해서 "얼마나
        # 완화해야 하는지"까지는 못 보고 "완화하면 늘어날 후보군의 품질"만 봄(아래 한계 참고).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from src.monitor.supabase_store import SupabaseSignalStore
          from src.analysis.signal_generator import SignalType

          KST = ZoneInfo("Asia/Seoul")
          store = SupabaseSignalStore(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          since_iso = (datetime.now(KST) - timedelta(days=180)).astimezone(timezone.utc).isoformat()
          rows = store.get_evaluated_signals(since_iso)

          watch_rows = [r for r in rows if r["signal_type"] == SignalType.WATCH.value and r.get("watch_blocked_by")]
          total_watch = sum(1 for r in rows if r["signal_type"] == SignalType.WATCH.value)
          print(f"[진단] 관심(WATCH) {total_watch}건 중 watch_blocked_by 기록된 {len(watch_rows)}건 분석")

          def bucket(gates_str: str) -> str:
              gates = set(g.strip() for g in gates_str.split(","))
              if gates == {"rsi"}:
                  return "RSI만 막힘 (rsi_max 완화 시 매수 전환 후보)"
              if gates == {"volume"}:
                  return "거래량만 막힘 (volume_min_ratio 완화 시 매수 전환 후보)"
              if gates == {"rsi", "volume"}:
                  return "RSI+거래량 둘 다 막힘 (둘 다 완화해야 전환)"
              return f"기타({gates_str})"

          buckets = defaultdict(list)
          for r in watch_rows:
              buckets[bucket(r["watch_blocked_by"])].append(r)

          for label, group in buckets.items():
              hits = sum(1 for r in group if r["return_1d_pct"] > 0)
              avg = sum(r["return_1d_pct"] for r in group) / len(group)
              print(f"  {label}: {len(group)}건, 상승 {hits}/{len(group)}({hits/len(group)*100:.0f}%), 평균 {avg:+.1f}%")

          buy_types = {SignalType.BUY.value, SignalType.STRONG_BUY.value}
          buy_rows = [r for r in rows if r["signal_type"] in buy_types]
          if buy_rows:
              hits = sum(1 for r in buy_rows if r["return_1d_pct"] > 0)
              avg = sum(r["return_1d_pct"] for r in buy_rows) / len(buy_rows)
              print(f"[비교기준] 현재 실제 매수(BUY) 신호: {len(buy_rows)}건, 적중 {hits}/{len(buy_rows)}({hits/len(buy_rows)*100:.0f}%), 평균 {avg:+.1f}%")
          PY

      - name: (진단용, Slack 미전송) 9/3 08:13 KST 장전 매도 알림 4건 reason 확인
        # 9/3 08:13 KST scan_top_n=60 드라이런에서 현대차·HD한국조선해양·두산에너빌리티·
        # 우리기술투자가 종합점수가 -0.15보다 높은데도(예: -0.019) 매도로 분류됨 — 코드
        # 추적 결과 stale_data_override(당일 급락 시 매도)가 의심됨: 장전이라 실시간
        # 거래량이 0이면 _inject_today_row가 오늘 행 주입을 건너뛰어 day_return이 "오늘"이
        # 아니라 FDR의 마지막 실제 거래일(어제) 등락률을 담게 되고, 이게 "당일 급락"으로
        # 잘못 라벨링될 수 있음. get_evaluated_signals()는 return_1d_pct가 채워진(1일 경과)
        # 신호만 반환해 방금 발생한 신호는 안 잡히므로, stock_signal_log를 직접 조회해
        # reason 원문으로 가설을 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from supabase import create_client

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          tickers = ["005380", "009540", "034020", "041190"]
          result = (
              client.table("stock_signal_log")
              .select("ticker,signal_type,score,reason,alerted_at")
              .in_("ticker", tickers)
              .order("alerted_at", desc=True)
              .limit(20)
              .execute()
          )
          print(f"[진단] 조회 {len(result.data)}건 (최근 20건 중 대상 티커 필터링 전)")
          for r in result.data:
              print(f"  [{r['ticker']}] {r['signal_type']} 점수={r['score']:+.3f} @ {r['alerted_at']}")
              print(f"    reason: {r.get('reason')}")
          PY

      - name: (진단용, Slack 미전송) 가상매매 손절 청산 후 목표가 도달 여부 확인
        # 가상매매 누적 손익이 여전히 마이너스(-0.8%)인 이유 진단 (2026-09-03, 사용자 질의) —
        # 손절 비율(55%, 26/47)이 익절 비율(26%, 12/47)보다 훨씬 높은데, 현재 ATR 배수
        # (stop×1.5 / target×2.5, 손익분기 승률 약 37.5%)로는 26%는 손익분기에 못 미침.
        # "신호 자체가 틀렸다"와 "방향은 맞았는데 손절폭이 너무 좁아 일찍 끊겼다"를 구분하기
        # 위해, 손절 청산된 포지션들이 진입 시점부터 max_hold_days(10거래일) 안에 원래
        # 목표가까지 도달했을지를 FinanceDataReader로 사후 확인. 새 실시간 API 호출 없이
        # 이미 청산된 포지션 + 공개 일봉 데이터만 사용
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from supabase import create_client
          import FinanceDataReader as fdr

          KST = ZoneInfo("Asia/Seoul")
          MAX_HOLD_DAYS = 10  # config.yaml virtual_trading.max_hold_days

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          since_iso = (datetime.now(KST) - timedelta(days=180)).astimezone(timezone.utc).isoformat()
          result = (
              client.table("stock_virtual_position")
              .select("ticker,name,entry_price,entry_at,exit_price,exit_at,exit_reason,target_price,return_pct")
              .eq("status", "closed")
              .eq("exit_reason", "stop_hit")
              .gte("exit_at", since_iso)
              .order("exit_at")
              .execute()
          )
          rows = result.data or []
          print(f"[진단] 손절 청산 {len(rows)}건 — 진입 후 {MAX_HOLD_DAYS}거래일 내 원래 목표가 도달 여부 확인")

          would_hit = 0
          checked = 0
          errors = 0
          for r in rows:
              ticker = r["ticker"]
              target = r.get("target_price")
              if not target:
                  continue
              entry_at = datetime.fromisoformat(r["entry_at"].replace("Z", "+00:00")).astimezone(KST)
              try:
                  df = fdr.DataReader(ticker, start=entry_at.date(), end=entry_at.date() + timedelta(days=30))
              except Exception as e:
                  errors += 1
                  print(f"  [{ticker}] 조회 실패: {e}")
                  continue
              if df.empty:
                  continue
              window = df.iloc[:MAX_HOLD_DAYS]
              max_high = window["High"].max() if len(window) else None
              hit = max_high is not None and max_high >= target
              checked += 1
              if hit:
                  would_hit += 1
              print(
                  f"  [{ticker}] {r.get('name')}: 진입 {r['entry_price']:,} / 목표 {target:,.0f} / "
                  f"손절청산가 {r['exit_price']:,} / 이후 {len(window)}거래일 최고가 "
                  f"{max_high:,.0f} -> {'목표 도달' if hit else '미도달'}"
              )

          if checked:
              print(f"[결론] 손절 {checked}건 중 원래 목표가까지 갔다면 도달했을 것: {would_hit}건 ({would_hit/checked*100:.0f}%) | 조회 실패 {errors}건")
          else:
              print("[결론] 분석 가능한 손절 건 없음")
          PY
