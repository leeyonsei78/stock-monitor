              hits_1d = sum(1 for r in group if is_hit(r["signal_type"], r["return_1d_pct"]))
              hits_3d = sum(1 for r in group if is_hit(r["signal_type"], r["return_3d_pct"]))
              avg_1d = sum(r["return_1d_pct"] for r in group) / len(group)
              avg_3d = sum(r["return_3d_pct"] for r in group) / len(group)
