name: 인기검색종목 일일 아카이빙

on:
  schedule:
    # 평일 15:40 KST = UTC 06:40 (월~금) — 정규장 마감(15:30) 직후, 그날 인기검색종목 스냅샷 확보
    - cron: '40 6 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 임시 진단2 - 네이버 원본 HTML 구조 확인 (2026-09-19, 확인 후 제거 예정)
        run: |
          .venv/bin/python -c "
          import re
          import requests
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'}
          url = 'https://finance.naver.com/sise/lastsearch2.naver'
          resp = requests.get(url, headers=headers, timeout=10)
          text = resp.text
          print('status', resp.status_code, 'len', len(text))
          print('code= count:', text.count('code='))
          m = re.findall(r'code=(\d{6})', text)
          print('6digit code matches:', len(m), m[:10])
          # find any table class names
          classes = set(re.findall(r'<table[^>]*class=\"([^\"]+)\"', text))
          print('table classes found:', classes)
          # title tag
          t = re.search(r'<title>(.*?)</title>', text, re.S)
          print('title:', t.group(1).strip() if t else None)
          # dump a slice around first occurrence of item/main or 'lastsearch' related keyword
          idx = text.find('item/main.naver')
          print('item/main.naver idx:', idx)
          if idx == -1:
              idx2 = text.find('code=')
              print('first code= idx:', idx2)
              print(text[max(0,idx2-200):idx2+200] if idx2 != -1 else text[:1000])
          else:
              print(text[max(0,idx-200):idx+200])
          "

      - name: 인기검색종목 아카이빙
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .venv/bin/python archive_search_popularity.py
