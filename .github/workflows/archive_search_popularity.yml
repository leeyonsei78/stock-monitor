name: 인기검색종목 일일 아카이빙

on:
  schedule:
    # 평일 15:40 KST = UTC 06:40 (월~금) — 정규장 마감(15:30) 직후, 그날 인기검색종목 스냅샷 확보
    - cron: '40 6 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 임시 진단 - 네이버 실측 파싱 확인 (2026-09-19, 확인 후 제거 예정)
        run: |
          .venv/bin/python -c "
          from src.api.naver_search import get_popular_search_stocks
          rows = get_popular_search_stocks(limit=10)
          print(f'파싱 결과 {len(rows)}건')
          for r in rows:
              print(r)
          "

      - name: 인기검색종목 아카이빙
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .venv/bin/python archive_search_popularity.py
