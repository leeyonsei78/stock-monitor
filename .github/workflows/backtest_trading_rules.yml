name: 워크포워드 매매규칙 백테스트

on:
  workflow_dispatch:  # 수동 실행 버튼 — backtest_trading_rules.py와 동일하게
                      # 스케줄 없음(재현성 낮은 동적 유니버스라 정기 자동 실행 대상 아님, CLAUDE.md 참고)

jobs:
  trading-rules-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 150종목 × 2년치 지표 계산 + ATR 배수 그리드서치(2026-09-14 추가)

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 워크포워드 매매규칙 백테스트 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: .venv/bin/python backtest_trading_rules.py

      - name: 결과 CSV 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trading-rules-result-${{ github.run_id }}
          path: backtest_trading_rules_result.csv
          retention-days: 90
          if-no-files-found: warn
