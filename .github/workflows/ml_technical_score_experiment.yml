name: 기술점수 ML 대체 실험

on:
  workflow_dispatch:  # 수동 실행 버튼 — backtest_trading_rules.py/quarterly_backtest.yml과
                      # 동일 원칙(신규 실험, 정기 스케줄 대상 아님, CLAUDE.md 참고)

jobs:
  ml-technical-score:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 2년치×35종목 지표 재계산 + Ridge/Logistic 학습

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 기술점수 ML 대체 실험 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: .venv/bin/python backtest_ml_technical_score.py

      - name: 결과 CSV 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ml-technical-score-result-${{ github.run_id }}
          path: backtest_ml_technical_score_result.csv
          retention-days: 90
          if-no-files-found: warn
