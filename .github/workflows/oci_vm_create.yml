name: Oracle Cloud VM 자동 생성

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 시도 (용량 생기는 즉시 생성)
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: OCI SDK 설치
        run: pip install oci requests

      - name: VM 생성 시도
        env:
          OCI_USER_OCID:      ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:    ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID:   ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY:    ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:   ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 << 'PYEOF'
          import oci, os, sys, time, requests

          base_config = {
              "user":        os.environ["OCI_USER_OCID"],
              "fingerprint": os.environ["OCI_FINGERPRINT"],
              "tenancy":     os.environ["OCI_TENANCY_OCID"],
              "region":      os.environ["OCI_REGION"],
              "key_content": os.environ["OCI_PRIVATE_KEY"],
          }
          compartment_id = base_config["tenancy"]
          ssh_pub_key    = os.environ["OCI_SSH_PUBLIC_KEY"]

          # 도쿄(기본) → 오사카 순서로 시도
          primary = base_config["region"]
          regions = [primary] + [r for r in ["ap-osaka-1"] if r != primary]


          def get_or_create_subnet(net, cid):
              """서브넷이 없으면 VCN + IGW + 서브넷 자동 생성"""
              subnets = net.list_subnets(compartment_id=cid).data
              if subnets:
                  return subnets[0].id

              print("  서브넷 없음 → VCN 자동 생성 중...")
              vcn = net.create_vcn(oci.core.models.CreateVcnDetails(
                  compartment_id=cid,
                  cidr_block="10.0.0.0/16",
                  display_name="stock-monitor-vcn",
              )).data
              time.sleep(3)

              igw = net.create_internet_gateway(
                  oci.core.models.CreateInternetGatewayDetails(
                      compartment_id=cid,
                      vcn_id=vcn.id,
                      is_enabled=True,
                      display_name="stock-monitor-igw",
                  )
              ).data

              # 기본 라우트 테이블에 IGW 연결
              rt_id = net.get_vcn(vcn.id).data.default_route_table_id
              net.update_route_table(
                  rt_id,
                  oci.core.models.UpdateRouteTableDetails(route_rules=[
                      oci.core.models.RouteRule(
                          destination="0.0.0.0/0",
                          destination_type="CIDR_BLOCK",
                          network_entity_id=igw.id,
                      )
                  ])
              )

              # 기본 보안 목록에 SSH(22) 허용 추가
              sl_id = net.get_vcn(vcn.id).data.default_security_list_id
              existing = net.get_security_list(sl_id).data.ingress_security_rules
              net.update_security_list(
                  sl_id,
                  oci.core.models.UpdateSecurityListDetails(
                      ingress_security_rules=existing + [
                          oci.core.models.IngressSecurityRule(
                              protocol="6",
                              source="0.0.0.0/0",
                              source_type="CIDR_BLOCK",
                              is_stateless=False,
                              tcp_options=oci.core.models.TcpOptions(
                                  destination_port_range=oci.core.models.PortRange(min=22, max=22)
                              ),
                          )
                      ]
                  )
              )

              subnet = net.create_subnet(oci.core.models.CreateSubnetDetails(
                  compartment_id=cid,
                  vcn_id=vcn.id,
                  cidr_block="10.0.0.0/24",
                  display_name="stock-monitor-subnet",
              )).data
              print(f"  VCN/서브넷 자동 생성 완료: {subnet.id}")
              return subnet.id


          for region in regions:
              print(f"\n{'='*40}")
              print(f"리전 시도: {region}")

              cfg = {**base_config, "region": region}
              try:
                  compute  = oci.core.ComputeClient(cfg)
                  network  = oci.core.VirtualNetworkClient(cfg)
                  identity = oci.identity.IdentityClient(cfg)
              except Exception as e:
                  print(f"클라이언트 초기화 실패: {e}")
                  continue

              try:
                  ads = identity.list_availability_domains(compartment_id=compartment_id).data
                  print(f"가용 도메인 {len(ads)}개: {[a.name for a in ads]}")
              except Exception as e:
                  print(f"가용 도메인 조회 실패: {e}")
                  continue

              try:
                  images = compute.list_images(
                      compartment_id=compartment_id,
                      operating_system="Canonical Ubuntu",
                      operating_system_version="22.04",
                      shape="VM.Standard.A1.Flex",
                      sort_by="TIMECREATED",
                      sort_order="DESC",
                      limit=1,
                  ).data
                  if not images:
                      print("Ubuntu 22.04 ARM 이미지 없음")
                      continue
                  image_id = images[0].id
                  print(f"이미지: {image_id}")
              except Exception as e:
                  print(f"이미지 조회 실패: {e}")
                  continue

              try:
                  subnet_id = get_or_create_subnet(network, compartment_id)
                  print(f"서브넷: {subnet_id}")
              except Exception as e:
                  print(f"서브넷 준비 실패: {e}")
                  continue

              for ad in ads:
                  print(f"\n시도 중: {ad.name}")
                  try:
                      instance = compute.launch_instance(
                          oci.core.models.LaunchInstanceDetails(
                              compartment_id=compartment_id,
                              availability_domain=ad.name,
                              display_name="stock-monitor",
                              shape="VM.Standard.A1.Flex",
                              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                                  ocpus=1,
                                  memory_in_gbs=6,
                              ),
                              source_details=oci.core.models.InstanceSourceViaImageDetails(
                                  source_type="image",
                                  image_id=image_id,
                                  boot_volume_size_in_gbs=50,
                              ),
                              create_vnic_details=oci.core.models.CreateVnicDetails(
                                  subnet_id=subnet_id,
                                  assign_public_ip=True,
                              ),
                              metadata={"ssh_authorized_keys": ssh_pub_key},
                          )
                      ).data

                      print(f"VM 생성 성공! 리전: {region}, ID: {instance.id}")

                      slack_token   = os.environ.get("SLACK_BOT_TOKEN", "")
                      slack_channel = os.environ.get("SLACK_CHANNEL_ID", "")
                      if slack_token and slack_channel:
                          requests.post(
                              "https://slack.com/api/chat.postMessage",
                              headers={"Authorization": f"Bearer {slack_token}"},
                              json={
                                  "channel": slack_channel,
                                  "text": (
                                      f"✅ *Oracle Cloud VM 생성 완료!*\n"
                                      f"리전: `{region}` / VM ID: `{instance.id}`\n"
                                      f"OCI 콘솔 → Compute → Instances 에서 공인 IP 확인 후 SSH 접속\n"
                                      f"`ssh -i ~/.ssh/oracle_vm.key ubuntu@[공인IP]`"
                                  ),
                              },
                          )
                      sys.exit(0)

                  except oci.exceptions.ServiceError as e:
                      msg = str(e.message).lower() if e.message else ""
                      if e.status in (500, 429) or "capacity" in msg or "host" in msg:
                          print(f"  {ad.name}: 용량 부족 → 다음 시도")
                      else:
                          print(f"  오류 {e.status}: {e.message}")

              print(f"[{region}] 모든 AD 용량 부족")

          print("\n도쿄/오사카 모든 가용 도메인 용량 부족 — 15분 후 재시도")
          PYEOF
