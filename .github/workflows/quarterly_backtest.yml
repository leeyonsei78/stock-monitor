name: 분기별 기술점수 백테스트

on:
  schedule:
    # 분기 첫날 09:00 KST = UTC 00:00 (1/4/7/10월 1일)
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  quarterly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 35종목 × 2년치 지표 계산

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 분기별 백테스트 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: .venv/bin/python backtest_technical_score.py

      - name: 결과 CSV 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: backtest-result-${{ github.run_id }}
          path: backtest_result.csv
          retention-days: 90
