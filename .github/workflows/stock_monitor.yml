name: 실시간 주식 모니터

on:
  schedule:
    # 평일 08:00~09:00 KST = UTC 23:00~00:00 (전날 일~목), 10분 간격
    # GitHub Actions 스케줄 누락률 ~60-70% → 10분마다 시도해야 30분 내 최소 1회 보장
    - cron: '*/10 23 * * 0-4'
    # 평일 09:00~18:00 KST = UTC 00:00~09:00 (월~금), 10분 간격
    - cron: '*/10 0-8 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 34종목 × ~17초/종목 ≈ 10분, 여유 포함

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 주식 모니터 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_MOCK: 'true'
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 당일 공시 조회용 (2026-08-28 추가, 선택) — 미설정 시 공시 조회만 조용히 건너뜀
          # (opendart.fss.or.kr에서 무료 발급, GitHub Secrets에 DART_API_KEY로 등록 필요)
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 공매도 비중 조회용 (2026-08-28 추가, 선택) — pykrx가 KRX 회원 로그인을 요구함
          # (data.krx.co.kr 회원가입 시 발급되는 실제 로그인 ID/PW, API 키 아님)
          # 미설정 시 공매도 비중 조회만 조용히 건너뜀 — 값 자체는 GitHub Actions가 로그에서 자동 마스킹
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: .venv/bin/python run_monitor_once.py

      - name: (임시 진단용, Slack 미전송) PostgREST 스키마 캐시 재확인 — per/pbr insert 테스트
        # 2026-09-11: 원인 확정됨 — analyze_signal_metadata_correlation.yml DB 조회 진단에서
        # 최근 알림 20건 전부 per/pbr=None으로 발견 → run 34570944229(06:41:50 KST) 로그에서
        # WARNING 확인: "[051910] ['vkospi','futures_basis','sp500_change_pct','usdkrw_change_pct',
        # 'has_disclosure','per','pbr'] 포함 저장 실패(PGRST204: Could not find the 'pbr' column
        # of 'stock_signal_log' in the schema cache) — 제외하고 재시도" — get_current_price()
        # 파싱 자체는 정상(per=-11.75 등 실측 확인)이었으나, save_signal()의 insert 시점에
        # PostgREST가 마이그레이션된 pbr 컬럼을 스키마 캐시에서 못 찾아 insert 전체가 실패,
        # 폴백 로직이 per/pbr(그리고 우연히 같이 묶인 다른 정상 컬럼들까지)을 통째로 제외하고
        # 재시도한 것 — 즉 per/pbr 자체가 잘못된 게 아니라 PostgREST 스키마 캐시 지연 문제.
        # 마이그레이션 시점(06:41 이전)으로부터 시간이 지나 캐시가 자연 갱신됐는지 실제 insert로 재확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from supabase import create_client

          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          test_row = {
              "ticker": "TEST00",
              "signal_type": "매도",
              "score": 0.0,
              "current_price": 1,
              "per": 12.34,
              "pbr": 1.23,
              "bid_ask_ratio": 2.5,
          }
          try:
              result = client.table("stock_signal_log").insert(test_row).execute()
              row_id = result.data[0]["id"]
              print(f"[성공] per/pbr/bid_ask_ratio 포함 insert 성공 (id={row_id}) — 스키마 캐시 정상화됨")
              # 통계 오염 방지 — 테스트 행 즉시 삭제
              client.table("stock_signal_log").delete().eq("id", row_id).execute()
              print("[정리] 테스트 행 삭제 완료")
          except Exception as e:
              print(f"[실패] insert 여전히 실패 — 스키마 캐시 아직 미갱신: {e}")
          PY
