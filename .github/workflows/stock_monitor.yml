name: 실시간 주식 모니터

on:
  schedule:
    # 평일 08:00~09:00 KST = UTC 23:00~00:00 (전날 일~목), 10분 간격
    # GitHub Actions 스케줄 누락률 ~60-70% → 10분마다 시도해야 30분 내 최소 1회 보장
    - cron: '*/10 23 * * 0-4'
    # 평일 09:00~18:00 KST = UTC 00:00~09:00 (월~금), 10분 간격
    - cron: '*/10 0-8 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 34종목 × ~17초/종목 ≈ 10분, 여유 포함

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip 캐시 (패키지 다운로드만 캐싱 — venv 심볼릭 링크 파손 방지)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: 패키지 설치
        run: |
          python -m venv .venv
          .venv/bin/pip install --cache-dir ~/.cache/pip -r requirements.txt

      - name: 주식 모니터 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_MOCK: 'true'
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 당일 공시 조회용 (2026-08-28 추가, 선택) — 미설정 시 공시 조회만 조용히 건너뜀
          # (opendart.fss.or.kr에서 무료 발급, GitHub Secrets에 DART_API_KEY로 등록 필요)
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 공매도 비중 조회용 (2026-08-28 추가, 선택) — pykrx가 KRX 회원 로그인을 요구함
          # (data.krx.co.kr 회원가입 시 발급되는 실제 로그인 ID/PW, API 키 아님)
          # 미설정 시 공매도 비중 조회만 조용히 건너뜀 — 값 자체는 GitHub Actions가 로그에서 자동 마스킹
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: .venv/bin/python run_monitor_once.py
