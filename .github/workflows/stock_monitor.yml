name: 실시간 주식 모니터

on:
  schedule:
    # 평일 08:00, 08:30 KST = UTC 23:00, 23:30 (전날 일~목) — 08:00은 버퍼용(코드에서 장외 판단)
    - cron: '0,30 23 * * 0-4'
    # 평일 09:00~17:30 KST = UTC 00:00~08:30 (월~금), 30분 간격
    - cron: '0,30 0-8 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 34종목 × ~17초/종목 ≈ 10분, 여유 포함

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 캐시 복원
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 패키지 설치 (캐시 미스 시에만)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: 주식 모니터 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_MOCK: 'true'
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .venv/bin/python run_monitor_once.py
