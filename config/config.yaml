# ==========================================
# KIS (한국투자증권) API 설정
# ==========================================
kis:
  mock_base_url: "https://openapivts.koreainvestment.com:29443"
  real_base_url: "https://openapi.koreainvestment.com:9443"
  mock_ws_url: "ws://ops.koreainvestment.com:31000"
  real_ws_url: "ws://ops.koreainvestment.com:21000"
  token_expire_hours: 24

# ==========================================
# 매매 기본 설정
# ==========================================
trading:
  mode: "manual"                 # "auto" | "manual"
  market: "KSE"                  # KSE(코스피) | KOSDAQ
  max_stocks: 5                  # 동시 보유 최대 종목 수
  max_budget_per_stock: 1000000  # 종목당 최대 투자금 (원)
  total_budget: 5000000          # 총 투자 예산 (원)
  fee_rate: 0.00015              # 증권사 수수료율
  tax_rate: 0.0018               # 증권거래세 (매도 시)

# ==========================================
# 운영 시간
# ==========================================
schedule:
  market_open: "09:00"
  market_close: "15:30"
  pre_market_check: "08:50"     # 장 시작 전 종목 스크리닝 시간
  scan_interval_seconds: 30      # 실시간 스캔 주기 (초)
  signal_interval_seconds: 60   # 매매 신호 체크 주기 (초)

# ==========================================
# 리스크 관리
# ==========================================
risk:
  stop_loss_pct: -3.0            # 손절 기준 (%) — ATR 계산 불가 시 fallback
  take_profit_pct: 5.0           # 익절 기준 (%) — ATR 계산 불가 시 fallback
  trailing_stop_pct: 2.0         # 트레일링 스탑 (%)
  max_daily_loss_pct: -5.0       # 일일 최대 손실 한도 (%)
  position_sizing: "fixed"       # "fixed" | "volatility" | "equal_weight"

  # 종목별 변동성(ATR) 기반 동적 손절/목표가 (2026-08-21 추가)
  # 손절% = -clamp(atr_pct * atr_stop_multiplier, stop_loss_min~max)
  # 목표% =  clamp(atr_pct * atr_target_multiplier, take_profit_min~max)
  atr_stop_multiplier: 1.5
  atr_target_multiplier: 2.5
  stop_loss_min_pct: -6.0
  stop_loss_max_pct: -1.5
  take_profit_min_pct: 3.0
  take_profit_max_pct: 10.0

# ==========================================
# 실시간 모니터 설정
# ==========================================
monitor:
  scan_top_n: 30               # 거래량 상위 N개 종목 스캔
  scan_interval_sec: 1800      # 스캔 주기 (초, 기본 30분)
  # 동일 종목 재알림 쿨다운 (초). 2026-08-26: 1800(30분) → 14400(4시간)
  # 30분은 실제 스캔 간격보다 짧아 억제 기능을 전혀 못 했음 — 8/26 실측에서 동일 종목
  # 연속 알림 간격이 최소 34분·중앙값 64분(GitHub Actions 스케줄 누락 때문)이라
  # 30분 미만 간격이 0건, 즉 쿨다운이 단 한 번도 발동 못 함. 그 결과 SK텔레콤
  # "외국인 5일 연속 매도"가 하루 10회, KB금융·LG화학이 각 9회 동일 사유로 재발송돼
  # 전체 알림 63건 중 28건(44%)이 순수 중복이었음.
  alert_cooldown_sec: 14400
  watchlist:                   # 항상 감시할 종목 (종목코드 6자리) — 스크리닝(가격/거래량/시총) 미적용
    - "005930"                 # 삼성전자 (반도체)
    - "000660"                 # SK하이닉스 (반도체) — 삼성전자와 상관관계 높지만 섹터 이중확인 목적으로 유지
    - "035420"                 # NAVER (인터넷 플랫폼)
    - "051910"                 # LG화학 (2차전지/화학)
    - "005380"                 # 현대차 (자동차, 2026-08-24 추가)
    - "207940"                 # 삼성바이오로직스 (바이오, 2026-08-24 추가)
    - "105560"                 # KB금융 (금융지주, 2026-08-24 추가)
    - "005490"                 # POSCO홀딩스 (철강/소재, 2026-08-24 추가)
    - "012450"                 # 한화에어로스페이스 (방산/우주항공, 2026-08-24 추가)
    - "035720"                 # 카카오 (플랫폼/메신저·핀테크, 2026-08-24 추가)
    - "009540"                 # HD한국조선해양 (조선, 2026-08-24 추가)
    - "034020"                 # 두산에너빌리티 (원자력, 2026-08-24 추가)
    - "041190"                 # 우리기술투자 (블록체인/가상자산 — 국내 상장사 중 순수 스테이블코인 대장주는
                                # 없어 빗썸 지분 보유로 국내에서 가장 널리 통용되는 가상자산 테마 대장주로 대체, 2026-08-24 추가)
    - "277810"                 # 레인보우로보틱스 (로봇 — 삼성전자 지분투자로 로봇 테마 대장주로 가장 널리 통용됨, 2026-08-24 추가)
    - "377300"                 # 카카오페이 (핀테크/간편결제, 2026-08-24 추가)
    - "132030"                 # KODEX 골드선물(H) (금, 2026-08-25 추가 — get_current_price로
                                # market_name="ETF" 실측 확인, 개별주 아닌 원자재 ETF라 워치리스트
                                # 내 유일한 non-stock 자산군)
    - "017670"                 # SK텔레콤 (통신, 2026-08-25 추가)
    - "010950"                 # S-Oil (정유/에너지, 2026-08-25 추가)
    - "090430"                 # 아모레퍼시픽 (화장품, 2026-08-25 추가)
    - "352820"                 # 하이브 (엔터테인먼트, 2026-08-25 추가)
  watchlist_names:             # 위 종목의 한글명 (2026-08-24 추가)
    # get_current_price(FHKST01010100)의 hts_kor_isnm이 이 TR에서는 항상 빈 문자열로 와서
    # (get_top_volume_stocks/FHPST01710000은 정상 제공) 워치리스트 종목명이 Slack에 공백으로
    # 나가던 버그 수정 — API에 의존하지 않도록 워치리스트 이름은 여기서 직접 관리
    "005930": "삼성전자"
    "000660": "SK하이닉스"
    "035420": "NAVER"
    "051910": "LG화학"
    "005380": "현대차"
    "207940": "삼성바이오로직스"
    "105560": "KB금융"
    "005490": "POSCO홀딩스"
    "012450": "한화에어로스페이스"
    "035720": "카카오"
    "009540": "HD한국조선해양"
    "034020": "두산에너빌리티"
    "041190": "우리기술투자"
    "277810": "레인보우로보틱스"
    "377300": "카카오페이"
    "132030": "KODEX 골드선물(H)"
    "017670": "SK텔레콤"
    "010950": "S-Oil"
    "090430": "아모레퍼시픽"
    "352820": "하이브"
  watchlist_markets:           # (2026-08-24 재검증: 실제로는 거의 항상 비워두는 게 맞음, 아래 참고)
    # 041190/277810(코스닥)에 "Q" 지정했다가 실제 스캔에서
    # "ERROR INVALID FID_COND_MRKT_DIV_CODE" 로 조회 자체가 실패하는 걸 실측으로 확인 —
    # get_current_price(FHKST01010100)는 이 파라미터로 "Q"를 아예 안 받음. "J"로 호출해도
    # market_name 응답 필드로 코스닥/코스피가 정확히 구분되므로(2026-08-24 정규화 기능 참고)
    # 코스닥 종목도 기본값 "J" 그대로 두는 게 맞음 — 제거함
    # 예전 comment("코스닥 watchlist 종목은 여기에 ticker: Q 추가")는 2026-08-13 당시 근거를
    # 재확인 못 해 그대로 믿고 따라했다가 이번에 틀렸다는 게 실측으로 드러남 — 앞으로 이 값은
    # 함부로 채우지 말고 필요할 때마다 market_name으로 먼저 검증할 것

# ==========================================
# 가상매매(paper trading) 추적 (2026-08-24 추가)
# ==========================================
# 매수/관심 신호가 뜰 때 "지금 샀다고 가정"하고 목표가/손절가/반대신호 도달까지 계속 추적해서
# Slack으로 청산 결과를 알림 — 신호만이 아니라 리스크관리(목표/손절 설정)까지 포함한 실제
# 거래 결과를 검증하기 위함. stock_signal_log 기반 1일/3일 스냅샷 평가(evaluate_signals.py)와는
# 별개로 병행 — 그건 "신호 방향이 맞았나", 이건 "그 거래 계획이 실제로 돈을 벌었나"를 잼
virtual_trading:
  enabled: true
  include_watch: true          # 관심(WATCH) 신호도 가상매수 대상 포함 (목표/손절가는 이미 계산돼 있음)
  max_hold_days: 10            # 목표가/손절가/반대신호 다 안 나오면 이 거래일 후 타임아웃 청산

# ==========================================
# 로그 설정
# ==========================================
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  file: "logs/trading.log"
  max_bytes: 10485760            # 10MB
  backup_count: 5
