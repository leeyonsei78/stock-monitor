# ==========================================
# KIS (한국투자증권) API 설정
# ==========================================
kis:
  mock_base_url: "https://openapivts.koreainvestment.com:29443"
  real_base_url: "https://openapi.koreainvestment.com:9443"
  mock_ws_url: "ws://ops.koreainvestment.com:31000"
  real_ws_url: "ws://ops.koreainvestment.com:21000"
  token_expire_hours: 24

# ==========================================
# 매매 기본 설정
# ==========================================
trading:
  mode: "manual"                 # "auto" | "manual"
  market: "KSE"                  # KSE(코스피) | KOSDAQ
  max_stocks: 5                  # 동시 보유 최대 종목 수
  max_budget_per_stock: 1000000  # 종목당 최대 투자금 (원)
  total_budget: 5000000          # 총 투자 예산 (원)
  fee_rate: 0.00015              # 증권사 수수료율
  tax_rate: 0.0018               # 증권거래세 (매도 시)

# ==========================================
# 운영 시간
# ==========================================
schedule:
  market_open: "09:00"
  market_close: "15:30"
  pre_market_check: "08:50"     # 장 시작 전 종목 스크리닝 시간
  scan_interval_seconds: 30      # 실시간 스캔 주기 (초)
  signal_interval_seconds: 60   # 매매 신호 체크 주기 (초)

# ==========================================
# 리스크 관리
# ==========================================
risk:
  stop_loss_pct: -3.0            # 손절 기준 (%) — ATR 계산 불가 시 fallback
  take_profit_pct: 5.0           # 익절 기준 (%) — ATR 계산 불가 시 fallback
  trailing_stop_pct: 2.0         # 트레일링 스탑 (%)
  max_daily_loss_pct: -5.0       # 일일 최대 손실 한도 (%)
  position_sizing: "fixed"       # "fixed" | "volatility" | "equal_weight"

  # 종목별 변동성(ATR) 기반 동적 손절/목표가 (2026-08-21 추가)
  # 손절% = -clamp(atr_pct * atr_stop_multiplier, stop_loss_min~max)
  # 목표% =  clamp(atr_pct * atr_target_multiplier, take_profit_min~max)
  atr_stop_multiplier: 1.5
  atr_target_multiplier: 2.5
  stop_loss_min_pct: -6.0
  stop_loss_max_pct: -1.5
  take_profit_min_pct: 3.0
  take_profit_max_pct: 10.0

# ==========================================
# 실시간 모니터 설정
# ==========================================
monitor:
  scan_top_n: 30               # 거래량 상위 N개 종목 스캔
  scan_interval_sec: 1800      # 스캔 주기 (초, 기본 30분)
  alert_cooldown_sec: 1800     # 동일 종목 재알림 쿨다운 (초, 기본 30분)
  watchlist:                   # 항상 감시할 종목 (종목코드 6자리)
    - "005930"                 # 삼성전자
    - "000660"                 # SK하이닉스
    - "035420"                 # NAVER
    - "051910"                 # LG화학
  watchlist_names:             # 위 종목의 한글명 (2026-08-24 추가)
    # get_current_price(FHKST01010100)의 hts_kor_isnm이 이 TR에서는 항상 빈 문자열로 와서
    # (get_top_volume_stocks/FHPST01710000은 정상 제공) 워치리스트 종목명이 Slack에 공백으로
    # 나가던 버그 수정 — API에 의존하지 않도록 워치리스트 이름은 여기서 직접 관리
    "005930": "삼성전자"
    "000660": "SK하이닉스"
    "035420": "NAVER"
    "051910": "LG화학"
  watchlist_markets:           # 코스닥 watchlist 종목은 여기에 ticker: "Q" 추가 (기본값 "J" = 코스피)
    # "035900": "Q"            # 예시: 오뚜기 코스닥이면 이렇게 추가

# ==========================================
# 가상매매(paper trading) 추적 (2026-08-24 추가)
# ==========================================
# 매수/관심 신호가 뜰 때 "지금 샀다고 가정"하고 목표가/손절가/반대신호 도달까지 계속 추적해서
# Slack으로 청산 결과를 알림 — 신호만이 아니라 리스크관리(목표/손절 설정)까지 포함한 실제
# 거래 결과를 검증하기 위함. stock_signal_log 기반 1일/3일 스냅샷 평가(evaluate_signals.py)와는
# 별개로 병행 — 그건 "신호 방향이 맞았나", 이건 "그 거래 계획이 실제로 돈을 벌었나"를 잼
virtual_trading:
  enabled: true
  include_watch: true          # 관심(WATCH) 신호도 가상매수 대상 포함 (목표/손절가는 이미 계산돼 있음)
  max_hold_days: 10            # 목표가/손절가/반대신호 다 안 나오면 이 거래일 후 타임아웃 청산

# ==========================================
# 로그 설정
# ==========================================
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  file: "logs/trading.log"
  max_bytes: 10485760            # 10MB
  backup_count: 5
