# ==========================================
# 기술적 지표 설정
# ==========================================
indicators:
  rsi:
    period: 14
    oversold: 30        # 과매도 기준 → 매수 신호
    overbought: 70      # 과매수 기준 → 매도 신호

  macd:
    fast: 12
    slow: 26
    signal: 9

  bollinger_bands:
    period: 20
    std_dev: 2.0

  moving_average:
    short: 5
    mid: 20
    long: 60

  volume:
    surge_ratio: 2.0    # 평균 대비 거래량 급증 비율 (2배 이상)
    ma_period: 20       # 거래량 이동평균 기간

# ==========================================
# 투자자 동향 분석 설정
# ==========================================
investor_analysis:
  # 2026-08-21: program 가중치를 foreign/institution/individual로 재분배.
  # KIS inquire-investor(FHKST01010900) 응답에 프로그램매매 수량 필드가 실제로
  # 제공되지 않아 program은 항상 0으로 고정됨(src/api/kis_api.py) — 기존처럼
  # program에 20%를 배정해두면 그 몫이 그냥 버려져 수급 점수가 이론상 최대
  # ±0.80을 못 넘던 문제를 수정. 원래 비율(35:30:15)을 유지한 채 재분배.
  foreign:
    weight: 0.45          # 0.35→0.45
    buy_signal_days: 3    # N일 연속 순매수 → 강한 매수 신호
    strong_buy_threshold: 100000  # 강한 매수 기준 (주)

  institution:
    weight: 0.35          # 0.30→0.35
    buy_signal_days: 3
    strong_buy_threshold: 50000

  program:
    weight: 0.0           # 0.20→0.0 — KIS API가 데이터를 제공하지 않아 항상 0, 점수 계산에서 제외
    arbitrage_weight: 0.5  # 차익거래 가중치
    non_arbitrage_weight: 0.5  # 비차익거래 가중치

  individual:             # 개미 (역방향 지표로 활용)
    weight: 0.20          # 0.15→0.20
    contrarian: true      # 개미가 많이 사면 매도 신호로 해석
    contrarian_threshold: 200000  # 개미 대량 매수 시 경계

# ==========================================
# 매매 신호 가중치 (합계 = 1.0)
# ==========================================
signal_weights:
  # 2026-08-21 백테스트(2년, 35종목, 17,535건) 기반 재조정:
  # 개별 지표 vs 향후 3일 수익률 상관계수 — 볼린저(+0.026)·상대강도(+0.023)가 가장 낫고
  # MACD(-0.013)·거래량(-0.022)은 역방향(높을수록 오히려 손해)으로 나와 비중 축소.
  # 단, 전 지표 상관계수가 0.03 이하로 작아 "확실한 개선"이 아니라 "덜 나쁜 쪽으로" 조정임.
  rsi: 0.15
  macd: 0.05                # 0.15→0.05 (백테스트에서 역방향 상관관계)
  bollinger: 0.20            # 0.10→0.20 (백테스트에서 가장 강한 정방향 상관관계)
  moving_average: 0.10
  volume: 0.05               # 0.10→0.05 (백테스트에서 역방향 상관관계)
  relative_strength: 0.15    # 0.10→0.15 (백테스트에서 두번째로 강한 정방향 상관관계)
  investor_sentiment: 0.30   # 투자자 동향이 가장 중요 (백테스트 불가 — KIS API가 최근 30거래일만 제공)

# ==========================================
# 예상 등락률 (경험적 추정 — 2026-08-21 추가, 2026-08-24 "변동률"→"등락률" 명칭 변경)
# ==========================================
# 실제 신호-결과 데이터(stock_signal_log 1일/3일 수익률)가 충분히 쌓이기 전까지의 잠정치.
# 공식: 예상등락률 = 방향(signal_type 기준, 2026-08-24 이전엔 점수 부호 기준이었으나
#   stale_data_override로 종합점수 부호와 signal_type이 어긋나는 경우가 생겨 수정) ×
#   ATR% × (multiplier_min ~ multiplier_max, 신호강도에 비례)
# 데이터가 쌓이면 회귀모델 기반 예측으로 교체 예정 (evaluate_signals.py 참고)
prediction:
  confidence_score_ref: 0.75   # 이 절대값 점수(강한매수/매도 기준)에서 신뢰도 100%로 간주
  multiplier_min: 0.5          # 신뢰도 0%일 때 ATR 대비 배율 (최소 기대 변동)
  multiplier_max: 1.5          # 신뢰도 100%일 때 ATR 대비 배율 (최대 기대 변동)

# ==========================================
# 매수 조건 (AND 조건)
# ==========================================
buy_conditions:
  min_signal_score: 0.30        # 최소 매수 신호 점수 (0~1) — 2026-08-20: 0.35→0.30 완화 (최고점수 0.29로 매수신호 구조적 불가)
  rsi_max: 60                   # RSI 60 이하일 때만 매수
  volume_min_ratio: 1.3         # 평균 거래량의 1.3배 이상
  foreign_net_buy: false        # 외국인 순매수 필수 조건 해제 (2026-08-18: AND 조건 완화)
  price_above_ma20: false       # 20일 이평선 조건 해제 (과매도 반등 기회 포착)

# ==========================================
# 매도 조건 (OR 조건 - 하나라도 해당되면 매도)
# ==========================================
sell_conditions:
  min_signal_score: -0.50       # 매도 신호 점수 이하
  rsi_min: 70                   # RSI 70 이상 과매수
  stop_loss_override: true      # 손절 조건 우선 적용
  take_profit_override: true    # 익절 조건 우선 적용
  # RSI 과매수/외국인 연속매도 "단독조건" 매도의 종합점수 가드 (2026-08-28 강화)
  # 기존엔 "score < 0"이라 -0.021 같은 사실상 0에 가까운 값도 통과시켜 실질 필터 역할을
  # 못 했음 — 8/28 주간 리포트 실측: 매도 적중률 86/168(51.2%, 거의 랜덤), 매도 발동 시점
  # 평균 종합점수가 +0.115~+0.156(양수!)로 관측돼 "약한 음수·양수 점수에도 매도가 쉽게
  # 나간다"는 결론. -0.50(순수 종합점수 매도선)의 절반 수준인 -0.15로 강화해 사실상 0에
  # 가까운 애매한 경우를 걸러내되, 확실한 하락 경고(stale_data_override)는 이 가드와
  # 무관하게 그대로 유지(당일 급락은 설계상 종합점수 무시가 의도된 것이라 별개).
  # weekly_accuracy_report.py의 매도 사유별 세부 적중률로 다음 주부터 효과 관찰할 것.
  standalone_score_max: -0.15

# ==========================================
# 당일 투자자 데이터 미집계 시 안전장치 (2026-08-24 추가)
# ==========================================
# 당일 투자자 데이터가 아직 집계 전이면 전일 데이터로 대체되는데(위 kis_api.py 참고), 이때 수급
# 30% 가중치가 전일 기준으로 왜곡될 수 있음 — 그 상태에서 당일 등락폭이 극단적이면 왜곡된 종합점수를
# 무시하고 예외적으로 신호 발동. 실측 사례: 8/24 삼성전자 당일 -8.5% 급락에도 전일(8/21, 급등일)
# 강세 수급 데이터가 남아있어 종합점수가 계속 양수로 나와 매도 조건이 전부 score<0 가드에 막혔음
stale_data_override:
  day_return_threshold: 0.05    # ±5% — buy_conditions의 거래량 예외와 동일 기준 재사용
  # 매수 오버라이드 차단 기준 (2026-08-24 추가): 외국인 또는 기관이 이 일수 이상 연속 순매도 중이면
  # 당일 급등해도 매수 오버라이드 적용 안 함 — 실측: 051910 LG화학이 외국인 2일·기관 4일 연속
  # 순매도인데도 당일+6.53% 급등만으로 매수 오버라이드가 발동해 종합점수 -0.068에도 매수로 분류됨
  buy_override_sell_streak_block: 2

# ==========================================
# 종목 스크리닝 조건
# ==========================================
screening:
  min_price: 5000               # 최소 주가 (원)
  max_price: 500000             # 최대 주가 (원)
  min_volume: 100000            # 최소 일거래량 (주)
  min_market_cap: 100000000000  # 최소 시가총액 (1000억)
  exclude_etf: true             # ETF 제외
  exclude_spac: true            # SPAC 제외
  # 거래대금(가격×거래량) 하한 (2026-08-28 추가) — 저가 테마주가 거래량만으로 통과하는 걸
  # 추가로 걸러내기 위함. 기본값 0(미적용) — 얼마가 적정한지 실측 데이터 없이 임의로 정하지
  # 않음. 켜려면 예: 5000000000(50억원/일) 같은 값으로 조정해 실제 스캔 결과 변화를 먼저 확인할 것
  min_trading_value: 0
