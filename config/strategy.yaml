# ==========================================
# 기술적 지표 설정
# ==========================================
indicators:
  rsi:
    period: 14
    oversold: 30        # 과매도 기준 → 매수 신호
    overbought: 70      # 과매수 기준 → 매도 신호

  macd:
    fast: 12
    slow: 26
    signal: 9

  bollinger_bands:
    period: 20
    std_dev: 2.0

  moving_average:
    short: 5
    mid: 20
    long: 60

  volume:
    surge_ratio: 2.0    # 평균 대비 거래량 급증 비율 (2배 이상)
    ma_period: 20       # 거래량 이동평균 기간

# ==========================================
# 투자자 동향 분석 설정
# ==========================================
investor_analysis:
  foreign:
    weight: 0.35          # 외국인 가중치 (강한 영향력)
    buy_signal_days: 3    # N일 연속 순매수 → 강한 매수 신호
    strong_buy_threshold: 100000  # 강한 매수 기준 (주)

  institution:
    weight: 0.30          # 기관 가중치
    buy_signal_days: 3
    strong_buy_threshold: 50000

  program:
    weight: 0.20          # 프로그램 매매 가중치
    arbitrage_weight: 0.5  # 차익거래 가중치
    non_arbitrage_weight: 0.5  # 비차익거래 가중치

  individual:             # 개미 (역방향 지표로 활용)
    weight: 0.15
    contrarian: true      # 개미가 많이 사면 매도 신호로 해석
    contrarian_threshold: 200000  # 개미 대량 매수 시 경계

# ==========================================
# 매매 신호 가중치 (합계 = 1.0)
# ==========================================
signal_weights:
  rsi: 0.20
  macd: 0.15
  bollinger: 0.10
  moving_average: 0.10
  volume: 0.15
  investor_sentiment: 0.30   # 투자자 동향이 가장 중요

# ==========================================
# 매수 조건 (AND 조건)
# ==========================================
buy_conditions:
  min_signal_score: 0.30        # 최소 매수 신호 점수 (0~1) — 2026-08-20: 0.35→0.30 완화 (최고점수 0.29로 매수신호 구조적 불가)
  rsi_max: 60                   # RSI 60 이하일 때만 매수
  volume_min_ratio: 1.3         # 평균 거래량의 1.3배 이상
  foreign_net_buy: false        # 외국인 순매수 필수 조건 해제 (2026-08-18: AND 조건 완화)
  price_above_ma20: false       # 20일 이평선 조건 해제 (과매도 반등 기회 포착)

# ==========================================
# 매도 조건 (OR 조건 - 하나라도 해당되면 매도)
# ==========================================
sell_conditions:
  min_signal_score: -0.50       # 매도 신호 점수 이하
  rsi_min: 70                   # RSI 70 이상 과매수
  stop_loss_override: true      # 손절 조건 우선 적용
  take_profit_override: true    # 익절 조건 우선 적용

# ==========================================
# 종목 스크리닝 조건
# ==========================================
screening:
  min_price: 5000               # 최소 주가 (원)
  max_price: 500000             # 최대 주가 (원)
  min_volume: 100000            # 최소 일거래량 (주)
  min_market_cap: 100000000000  # 최소 시가총액 (1000억)
  exclude_etf: true             # ETF 제외
  exclude_spac: true            # SPAC 제외
